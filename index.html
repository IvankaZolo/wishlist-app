<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список бажань</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="script.js" defer></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>

    <header>
        <h1>Список бажань</h1>
    </header>

    <main>
        <section id="add-wish">
            <h2>Додати бажання</h2>
            <form id="wish-form" action="#" method="post">
                <div>
                    <label for="item-name">Назва бажання:</label>
                    <input type="text" id="item-name" name="itemName" required>
                </div>
                <div>
                    <label for="item-price">Орієнтовна ціна (грн):</label>
                    <input type="number" id="item-price" name="itemPrice" min="0" step="1" required>
                </div>
                <div>
                    <label for="item-priority">Пріоритет:</label>
                    <select id="item-priority" name="itemPriority">
                        <option value="високий">Високий</option>
                        <option value="середній" selected>Середній</option>
                        <option value="низький">Низький</option>
                    </select>
                </div>
                <div>
                    <label for="item-link">Посилання на товар (необов'язково):</label>
                    <input type="url" id="item-link" name="itemLink">
                </div>
                <button type="submit" class="btn-submit">Додати до списку</button>
            </form>
        </section>

        <section id="wishlist">
          <div class="wishlist-header">
            <h2>Мої бажання</h2>
            <button type="button" id="btn-refresh" class="btn-refresh">Оновити з сервера</button>
            </div>

            <div id="status-message" class="status-message" style="display: none;"></div>
            
            <div class="cards" id="wishlist-cards">
                  <wish-item 
                  v-for="item in wishes" 
                   :key="item.id" 
                  :id="item.id"
                  :name="item.title" 
                  :price="item.price" 
                  :priority="item.priority"
                  :purchased="item.purchased"
                   @toggle="togglePurchased"
                   @delete="deleteWish">
                 </wish-item>
            </div>
        </section>
    </main>

    <aside id="summary">
        <h2>Підсумок</h2>
        <div class="summary-card">
            <p class="summary-label">Загальна орієнтовна сума:</p>
            <p class="total-sum" id="total-price">0 грн</p>
            <p class="summary-count">Усього заплановано речей: <strong id="total-count">0</strong></p>
        </div>
    </aside>

    <footer>
        <p>&copy; 2026 Студентка групи ІП-55 Шапкіна Іванна. Навчальний проєкт для курсу «ПВЗ».</p>
    </footer>
</body>
</html>
